name: Unpack automation once

on:
  push:
    paths:
      - ".github/workflows/unpack_once.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract without overwriting existing files
        run: unzip -n fanza-x-automation.zip

      - name: Commit extracted files and remove temporary files
        run: |
          rm -f fanza-x-automation.zip .github/workflows/unpack_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example src .github/workflows
          git add -u
          git commit -m "Add automation files from uploaded archive"
          git push
