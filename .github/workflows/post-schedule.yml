name: FANZA Scheduled Post

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post scheduled FANZA item
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python post_scheduled.py

      - name: Refill FANZA schedule
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          DMM_GENRE_IDS: ${{ secrets.DMM_GENRE_IDS }}
        run: python build_schedule.py

      - name: Save bot state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add schedule.json

          if [ -f posted_ids.json ]; then
            git add posted_ids.json
          fi

          git diff --cached --quiet || \
          git commit -m "Update FANZA bot state"

          git pull --rebase origin main
          git push
