name: Build FANZA Schedule HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build schedule HTML
        run: python build_schedule_html.py

      - name: Save schedule.html
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add schedule.html

          git diff --cached --quiet || \
          git commit -m "Update FANZA schedule page"

          git pull --rebase origin main
          git push
