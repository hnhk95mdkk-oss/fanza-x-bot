
<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>FANZA 投稿スケジュール</title>

<style>

body {
    margin: 0;
    padding: 16px;
    background: #f4f4f4;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

h1 {
    margin: 0 0 20px;
    font-size: 26px;
}

.day {
    margin-bottom: 26px;
}

.day h2 {
    font-size: 20px;
    margin: 0 0 10px;
}

.slots {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px, 1fr)
        );
    gap: 12px;
}

.slot {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}

.slot-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #111;
    color: white;
}

.slot-name {
    font-weight: bold;
}

.time {
    font-variant-numeric: tabular-nums;
}

.status {
    margin-left: auto;
    font-size: 12px;
    padding: 3px 7px;
    border-radius: 999px;
}

.pending {
    background: #666;
}

.posted {
    background: #2d7;
    color: #111;
}

.slot img {
    width: 100%;
    display: block;
    aspect-ratio: 4 / 3;
    object-fit: cover;
}

.body {
    padding: 12px;
}

.genre {
    font-size: 13px;
    color: #777;
    margin-bottom: 6px;
}

.title {
    font-size: 15px;
    line-height: 1.45;
    margin-bottom: 12px;
}

.body a {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #111;
    color: white;
    padding: 10px;
    border-radius: 10px;
    font-weight: bold;
}

</style>

</head>

<body>

<h1>
FANZA 投稿スケジュール
</h1>



</body>

</html>
